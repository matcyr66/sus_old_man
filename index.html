
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Old Man</title>

    <style>
        body {
            background-color: #111111;
            color: #e0e0e0;
            font-family: Georgia, serif;
            max-width: 750px;
            margin: 60px auto;
            padding: 20px;
            line-height: 1.7;
        }

        h1 {
            color: #b22222;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 35px;
        }

        #story {
            background-color: #1b1b1b;
            border: 1px solid #383838;
            border-radius: 8px;
            padding: 25px;
            min-height: 180px;
        }

        button {
            background-color: #6b1717;
            color: white;
            border: 1px solid #9c3434;
            padding: 11px 18px;
            margin: 12px 8px 0 0;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background-color: #922222;
        }

        input {
            background-color: #252525;
            color: white;
            border: 1px solid #777;
            padding: 10px;
            border-radius: 5px;
            font-size: 15px;
            margin-top: 10px;
            max-width: 90%;
        }

        .success {
            color: #32cd32;
            font-weight: bold;
        }

        .failure {
            color: #ff4040;
            font-weight: bold;
        }

        .muted {
            color: #999999;
            font-style: italic;
        }

        #controls {
            margin-top: 15px;
        }

        .hidden {
            display: none;
        }

        footer {
            text-align: center;
            color: #666666;
            font-size: 12px;
            margin-top: 35px;
        }
    </style>
</head>

<body>
    <h1>THE OLD MAN</h1>

    <div id="story">
        <p>"Welcome traveller...!" - An old man welcomes you.</p>
    </div>

    <div id="controls">
        <button id="continueButton" onclick="showContinue()">
            Continue
        </button>

        <div id="choiceControls" class="hidden">
            <p>Do you take his hand? Yes / No</p>

            <input
                type="text"
                id="choiceInput"
                placeholder="Enter your choice..."
                autocomplete="off"
            >

            <button onclick="makeChoice()">Submit</button>
        </div>

        <button id="rollButton" class="hidden" onclick="rollDice()">
            Roll D20
        </button>

        <button id="restartButton" class="hidden" onclick="startGame()">
            Play Again
        </button>
    </div>

    <footer>
        A little D&D-inspired experiment...
    </footer>

    <script>
        let stage = 0;
        let selectedChoice = "";
        let currentDC = 0;
        let successText = "";
        let failureText = "";

        const story = document.getElementById("story");
        const continueButton = document.getElementById("continueButton");
        const choiceControls = document.getElementById("choiceControls");
        const rollButton = document.getElementById("rollButton");
        const restartButton = document.getElementById("restartButton");
        const choiceInput = document.getElementById("choiceInput");

        function showContinue() {
            if (stage === 0) {
                story.innerHTML = `
                    <p>"It appears you are in a little bit of a predicament...
                    here, let me help you!" - The old man reaches out his hand.</p>
                `;

                stage = 1;
            }

            continueButton.classList.add("hidden");
            choiceControls.classList.remove("hidden");
            choiceInput.focus();
        }

        function makeChoice() {
            selectedChoice = choiceInput.value.trim().toLowerCase();

            if (selectedChoice === "") {
                story.innerHTML = `
                    <p>Please enter a choice first...</p>
                `;
                choiceInput.focus();
                return;
            }

            choiceControls.classList.add("hidden");

            if (selectedChoice === "yes") {
                currentDC = 13;

                story.innerHTML = `
                    <p>You grab the old man's hand... and suddenly...
                    you feel weak!</p>
                    <p>Roll for constitution!</p>
                `;

                successText = `You notice something is off. His eyes are pitch black. His figure is shifting in dark smoke. He is a Wrath. He tried to consume your life force.`;

                failureText = `You start to feel lightheaded and as if your soul was leaving your body. Suddenly, you pass out.`;

            } else if (selectedChoice === "no") {
                currentDC = 15;

                story.innerHTML = `
                    <p>"Those youngsters these days...! I see I got to teach you some manners!"
                    - The old man attempts to swing a dagger into your ribs.</p>
                    <p>Roll for dexterity!</p>
                `;

                successText = `You swiftly dodge and knock the dagger out of his hands. He is now disarmed, ha!`;

                failureText = `You feel a sharp pain in the side of your torso. There's metallic taste in your mouth and you drop to the floor.`;

            } else {
                currentDC = 12;

                story.innerHTML = `
                    <p>"You think you are a smart fella, eh? I'll show ya!"
                    - You see the old man swing the dagger that you block at the last moment.</p>
                    <p>Make a strength save.</p>
                `;

                successText = `You successfully take control of the blade and twist it. It is in your possession now. You point at the old man.`;

                failureText = `You struggle against the old man. He is surprisingly strong! Something isn't right... before you realise, the pitch black eyes are staring deep into your soul and you black out.`;
            }

            rollButton.classList.remove("hidden");
        }

        function rollDice() {
            const roll = Math.floor(Math.random() * 20) + 1;
            const success = roll >= currentDC;

            const resultClass = success ? "success" : "failure";
            const resultText = success
                ? "DC CHECK... SUCCESS!"
                : "DC CHECK... FAIL!";

            const narrative = success ? successText : failureText;

            story.innerHTML = `
                <p>Your D20 roll: ${roll}</p>
                <p class="${resultClass}">${resultText}</p>
                <p>${narrative}</p>
            `;

            rollButton.classList.add("hidden");
            restartButton.classList.remove("hidden");
        }

        function startGame() {
            stage = 0;
            selectedChoice = "";
            currentDC = 0;
            successText = "";
            failureText = "";
            choiceInput.value = "";

            story.innerHTML = `
                <p>"Welcome traveller...!" - An old man welcomes you.</p>
            `;

            continueButton.classList.remove("hidden");
            choiceControls.classList.add("hidden");
            rollButton.classList.add("hidden");
            restartButton.classList.add("hidden");
        }

        choiceInput.addEventListener("keydown", function(event) {
            if (
                event.key === "Enter" &&
                !choiceControls.classList.contains("hidden")
            ) {
                makeChoice();
            }
        });
    </script>
</body>
</html>
